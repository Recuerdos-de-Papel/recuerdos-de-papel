name: recuerdos_de_papel_admin
description: Aplicación Android para administración de Papelería Creativa - Recuerdos de Papel

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  state_notifier: ^1.0.0

  # Networking
  dio: ^5.4.0

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Utils
  intl: ^0.19.0
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  path: ^1.8.3
  connectivity_plus: ^7.0.0

  # UI
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.1
  flutter_slidable: ^3.0.0
  shimmer: ^3.0.0

  # Biometric
  local_auth: ^2.1.6

  # Notifications
  flutter_local_notifications: ^18.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/